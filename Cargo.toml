# SPDX-License-Identifier: MIT
[workspace]
resolver = "2"
members = [
    "crates/talicode-cli",
    "crates/talicode-core",
    "crates/talicode-agent",
    "crates/talicode-skills",
    "crates/talicode-memory",
    "crates/talicode-test",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/mackignacio/talicode"
authors = ["Mack Ignacio"]

[profile.release]
strip = true
lto = true
codegen-units = 1
