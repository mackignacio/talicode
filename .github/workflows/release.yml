# SPDX-License-Identifier: MIT
name: Release (npm)

# Cross-compile the native `tali` binary for every supported platform, attach
# each to the GitHub Release for the tag, then publish the single `talicode`
# npm package (which downloads the matching binary from that Release on install).
# Triggered by pushing a v* tag.
#
# Requires repo secret NPM_TOKEN — an npm token with publish rights and 2FA
# bypass enabled. Uses the built-in GITHUB_TOKEN for the Release upload.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: tali-darwin-arm64
            binext: ""
          - target: x86_64-apple-darwin
            os: macos-14
            asset: tali-darwin-x64
            binext: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: tali-linux-x64
            binext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset: tali-linux-arm64
            binext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: tali-win32-x64.exe
            binext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p talicode-cli
      - name: Rename to release asset
        shell: bash
        run: cp "target/${{ matrix.target }}/release/tali${{ matrix.binext }}" "${{ matrix.asset }}"
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: release + publish talicode
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p assets
          find artifacts -type f -exec cp {} assets/ \;
          ls -la assets
      - name: Attach binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --generate-notes
          fi
      - name: Publish talicode to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
