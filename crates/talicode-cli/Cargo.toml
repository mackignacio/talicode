# SPDX-License-Identifier: MIT
[package]
name = "talicode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TaliCode CLI — the `tali` command."

[[bin]]
name = "tali"
path = "src/main.rs"

[dependencies]
talicode-core = { path = "../talicode-core" }
talicode-agent = { path = "../talicode-agent" }
talicode-skills = { path = "../talicode-skills" }
talicode-memory = { path = "../talicode-memory" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
