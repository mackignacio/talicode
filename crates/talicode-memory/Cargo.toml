# SPDX-License-Identifier: MIT
[package]
name = "talicode-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TaliCode memory — semantic, episodic, working, and architectural memory."

[dependencies]
talicode-core = { path = "../talicode-core" }
talicode-skills = { path = "../talicode-skills" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
